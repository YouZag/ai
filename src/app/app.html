@if (auth.user(); as user) {
  @if (auth.isAdmin()) {
    <header class="cockpit-header">
      <strong>AI Cockpit</strong>
      <nav>
        <a routerLink="/vision" routerLinkActive="active">Vision</a>
        <a routerLink="/features" routerLinkActive="active">Features</a>
      </nav>
      <span class="spacer"></span>
      <span>{{ user.email }}</span>
      <button type="button" (click)="signOut()">Sign out</button>
    </header>
    <main>
      <router-outlet />
    </main>
  } @else {
    <section class="gate">
      <h1>AI Cockpit</h1>
      <p>{{ user.email }} is not an authorized admin.</p>
      <button type="button" (click)="signOut()">Sign out</button>
    </section>
  }
} @else {
  <section class="gate">
    <h1>AI Cockpit</h1>
    <p>Sign in to author the vision and steer the build.</p>
    <button type="button" (click)="signIn()">Sign in with Google</button>
  </section>
}
